# Bifrost configuration file example
# Copy to ~/.config/bifrost/config.toml and update values.

[romm]
url = "http://192.168.1.x:8080"
client_token = "rmm_your-token-here"
device_id = ""
timeout_seconds = 10.0   # increase if RomM is on a slow NAS or VPN (min 1.0)

[nas]
library_path = "/path/to/romm/library"
resources_path = "/path/to/romm/resources"
roms_subpath = "roms"
bios_subpath = "bios"

[esde]
roms_path = "~/ROMs"
gamelists_path = "~/.emulationstation/gamelists"
custom_systems_path = "~/.emulationstation/custom_systems"

[emudeck]
bios_path = "~/BIOS"
media_path = "/Emulation/tools/downloaded_media"
saves_path = "~/saves"

# Maps each RomM per-game asset type to its ES-DE media subfolder. This is the
# built-in default (shown here for reference) — omit [assets.folder_map]
# entirely to use it, or override only the keys you want to change (an
# override replaces the whole table, so re-list every key you keep).
[assets.folder_map]
cover = "covers"
fanart = "fanart"
box3d = "3dboxes"
box2d_back = "backcovers"
logo = "marquees"          # ES-DE marquees = game logos, not arcade marquees
miximage = "miximages"
title_screen = "titlescreens"
video_normalized = "videos"
manual = "manuals"
physical = "physicalmedia"
screenshots = "screenshots"
bezel = "bezels"           # non-standard ES-DE path, used by some themes

[sync]
conflict_strategy = "ask"
direction = "push_pull"
parallel_workers = 16   # threads for parallel symlink evaluation/apply (reduce if NAS is overloaded)
slot = "autosave"       # stable slot name for saves with no explicit numbered slot; must match
                        # the slot naming used by other RomM clients
prune_orphan_platforms = false   # opt in to reviewing/removing orphan platform folders
orphan_platform_strategy = "ask" # ask | remove | skip

[output]
format = "table"
verbose = false
log_file = ""

[cache]
enabled = true
ttl_roms_hours = 6
ttl_platforms_hours = 24
ttl_firmware_hours = 24
cache_dir = ""           # empty = ~/.cache/bifrost (XDG-aware)
